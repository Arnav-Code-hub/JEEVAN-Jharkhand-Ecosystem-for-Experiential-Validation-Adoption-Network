services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: jeevan-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: supabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jeevan-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: jeevan-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: jeevan
      MINIO_ROOT_PASSWORD: jeevan-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket on first start so the API has somewhere to write.
  minio-init:
    image: minio/mc:latest
    container_name: jeevan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 jeevan jeevan-dev-secret &&
      mc mb --ignore-existing local/jeevan-media &&
      echo bucket ready
      "

volumes:
  postgres_data:
  redis_data:
  minio_data: